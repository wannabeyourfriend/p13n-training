[project]
name = "klab-sft"
version = "0.1.0"
description = "Minimal SFT training (Unsloth + TRL) and vLLM serving"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "peft>=0.12.0",
    "unsloth>=2024.12.0",
    "trl>=0.12.0",
    "sentencepiece>=0.2.0",
    "wandb>=0.18.0",
    "vllm>=0.6.0",
    "pyyaml>=6.0",
]

[tool.uv.workspace]
members = []
